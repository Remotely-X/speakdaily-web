<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakDaily</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef3ff, #f8f6ff);
      color: #243b6b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(50, 70, 120, 0.15);
      max-width: 480px;
      margin: 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #4169c8;
    }
    p {
      font-size: 18px;
      line-height: 1.5;
      color: #52627f;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      border-radius: 14px;
      background: #4169c8;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .small {
      margin-top: 25px;
      font-size: 13px;
      color: #8a95ad;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SpeakDaily</h1>
    <p>Practice English every day with lessons, groups, and friendly challenges.</p>
    <a class="button" href="#">Coming soon</a>
    <div class="small">speakdaily.app</div>
  </div>
</body>
</html>
